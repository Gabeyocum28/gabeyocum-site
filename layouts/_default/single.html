{{ define "main" }}
  <article class="post">
    <header class="page-header">
      <p class="crumb"><a href="{{ "/posts/" | relURL }}">Writing</a></p>
      <h1>{{ .Title }}</h1>
      <p class="post-byline">
        {{ if .Date }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>{{ end }}
        <span class="dot">·</span>
        <span>{{ .ReadingTime }} min read</span>
      </p>
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
    <footer class="post-footer">
      <a href="{{ "/posts/" | relURL }}">← All writing</a>
    </footer>
  </article>
{{ end }}
