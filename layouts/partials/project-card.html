<li class="project-card" data-status="{{ .Params.status }}" data-slug="{{ .File.ContentBaseName }}"{{ with .Params.link }} data-link="{{ . }}"{{ end }}>
  <a class="project-card-link" href="{{ .RelPermalink }}">
    <div class="project-head">
      <h3 class="project-name">{{ .Title }}</h3>
      {{ if .Params.link }}<span class="status status-{{ .Params.status }}">{{ .Params.status }}</span>{{ else }}<span class="status status-down">not running</span>{{ end }}
    </div>
    {{ with .Description }}<p class="project-summary">{{ . }}</p>{{ end }}
  </a>
  <div class="project-foot">
    {{ with .Params.stack }}
      <ul class="stack">{{ range . }}<li>{{ . }}</li>{{ end }}</ul>
    {{ end }}
    {{ with .Params.link }}<a class="visit" href="{{ . }}" rel="noopener">Visit ↗</a>{{ end }}
  </div>
</li>
