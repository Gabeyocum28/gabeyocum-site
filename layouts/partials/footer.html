<footer class="site-footer">
  <div class="container site-footer-inner">
    <span>&copy; {{ now.Year }} {{ .Site.Params.author }}</span>
    <nav class="footer-links" aria-label="Contact">
      {{ partial "social.html" . }}
      {{ with .Site.Home.OutputFormats.Get "rss" }}<a href="{{ .Permalink }}">RSS</a>{{ end }}
    </nav>
  </div>
</footer>
<script>
  (function () {
    var btn = document.querySelector('.theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var root = document.documentElement;
      var current = root.getAttribute('data-theme');
      if (!current) current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
  })();
</script>
<script>
  (function () {
    var els = document.querySelectorAll('[data-slug][data-link]');
    if (!els.length) return;
    fetch('/status.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data || !data.projects) return;
        els.forEach(function (el) {
          var s = data.projects[el.getAttribute('data-slug')];
          if (!s) return;
          var badge = el.querySelector('.status');
          if (!badge) return;
          var up = s.up === true;
          badge.className = 'status status-' + (up ? 'live' : 'down');
          badge.textContent = up ? 'live' : 'down';
          badge.title = up ? 'Responding' : 'Not responding';
          if (data.checked) badge.title += ' as of ' + new Date(data.checked).toLocaleString();
        });
      })
      .catch(function () {});
  })();
</script>
