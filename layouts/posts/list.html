{{ define "main" }}
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
    {{ .Content }}
  </header>
  {{ with .Pages }}
    {{ partial "post-list.html" .ByDate.Reverse }}
  {{ else }}
    <p class="empty">No posts yet.</p>
  {{ end }}
{{ end }}
