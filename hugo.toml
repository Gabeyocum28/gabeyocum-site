baseURL = "https://gabeyocum.com/"
languageCode = "en-us"
title = "Gabe Yocum"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
timeZone = "America/Denver"

[permalinks]
  posts = "/posts/:contentbasename/"
  projects = "/projects/:contentbasename/"

[params]
  description = "Applied and computational mathematics, automation engineering, and independent projects."
  author = "Gabe Yocum"
  tagline = "Applied math at BYU. I build automation systems and a steady stream of side projects."

  # Contact links. Rendered on the home page, About page and footer.
  [params.social]
    email = "gabeyocum28@gmail.com"
    github = "https://github.com/Gabeyocum28"
    linkedin = "https://www.linkedin.com/in/gabriel-yocum-2849b2229/"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[menu]
  [[menu.main]]
    name = "Writing"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 2
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

